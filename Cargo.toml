[workspace]
members = ["crates/*"]
resolver = "3"
exclude = ["target", "scripts", "legacy/*"]

[workspace.package]
authors = ["Ahmet Asaf Güleç <ahmetasafgulec@gmail.com>"]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/evETOoOoOoO/Rust-Projelerim"
keywords = ["api", "math", "learning", "rust", "testing"]

[workspace.lints.rust]
dead_code = "warn"
unused_imports = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"
cargo_common_metadata = { level = "allow", priority = 1 }

[profile.release]
lto = "thin"
opt-level = 3
overflow-checks = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
