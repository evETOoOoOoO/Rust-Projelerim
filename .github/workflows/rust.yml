name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings" 
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      rust_changed: ${{ steps.filter.outputs.rust }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Check for Rust Changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          rust:
            - '**/*.rs'
            - '**/Cargo.toml'
            - '**/Cargo.lock'

  build-and-test:
    needs: check-changes
    if: needs.check-changes.outputs.rust_changed == 'true' || github.event_name == 'push'
    
    strategy:
      fail-fast: false 
      matrix:
        # Sistem her alt klasörde gezineceği için karmaşayı önlemek adına 
        # şimdilik en kararlı ortam olan ubuntu üzerinden doğrulamayı yapıyoruz.
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }} 

    steps:
    - uses: actions/checkout@v4
      with:
        # Tüm Git geçmişini çekiyoruz ki değişen dosyaları kıyaslayabilelim
        fetch-depth: 0
        convert-eol: false

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
        tools: cargo-nextest

    - name: Rust Cache
      uses: swatinem/rust-cache@v2
      with:
        key: ${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Dynamically Detect and Run CI on Changed Crates
      run: |
        echo "=== Degisen Klasorler ve Crate'ler Tespit Ediliyor ==="
        
        # 1. Değişen, yeni eklenen veya ismi değişen tüm dosyaları listele
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
        else
          # Doğrudan push yapıldıysa bir önceki commit ile kıyasla
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
        fi

        # 2. Değişen dosyaların ait olduğu benzersiz Cargo.toml konumlarını bul
        CRATES_TO_TEST=()
        for file in $CHANGED_FILES; do
          dir=$(dirname "$file")
          # Klasör ağacında yukarı doğru çıkarak en yakın Cargo.toml'u ara
          while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
            if [ -f "$dir/Cargo.toml" ]; then
              CRATES_TO_TEST+=("$dir")
              break
            fi
            dir=$(dirname "$dir")
          done
          # Eğer dosya doğrudan ana dizindeyse ve orada Cargo.toml varsa
          if [ -f "Cargo.toml" ]; then
            CRATES_TO_TEST+=(".")
          fi
        done

        # 3. Aynı klasörlerin tekrarlanmasını önlemek için listeyi temizle
        UNIQUE_CRATES=$(echo "${CRATES_TO_TEST[@]}" | tr ' ' '\n' | sort -u)

        if [ -z "$UNIQUE_CRATES" ]; then
          echo "Test edilecek aktif bir Rust projesi degisikligi bulunamadi."
          exit 0
        fi

        # 4. Bulunan her bir crate için sırayla işlemleri çalıştır
        for crate in $UNIQUE_CRATES; do
          echo "--------------------------------------------------"
          echo "👉 Proje Islemleri Baslatildi: Dizin -> $crate"
          echo "--------------------------------------------------"
          
          # Klasöre giriş yap
          cd "$crate"
          
          echo "1) Format Kontrolü Yapiliyor..."
          cargo fmt -- --check
          
          echo "2) Clippy Analizi Yapiliyor..."
          cargo clippy --all-targets --all-features --no-deps -- -D warnings
          
          echo "3) Testler Hazirlaniyor (Derleme)..."
          cargo test --no-run
          
          echo "4) Testler Kosuluyor..."
          cargo nextest run --all-features
          
          # Ana dizine geri dön (Döngünün bir sonraki klasörü doğru bulması için)
          cd - > /dev/null
        done

  ci-success:
    needs: [check-changes, build-and-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI Status
        run: |
          CHECK_CHANGES_STATUS="${{ needs.check-changes.result }}"
          BUILD_TEST_STATUS="${{ needs.build-and-test.result }}"
          
          if [ "$CHECK_CHANGES_STATUS" = "failure" ] || \
             [ "$BUILD_TEST_STATUS" = "failure" ] || \
             [ "$BUILD_TEST_STATUS" = "cancelled" ] || \
             { [ "$BUILD_TEST_STATUS" = "skipped" ] && [ "${{ needs.check-changes.outputs.rust_changed }}" = "true" ]; }; then
            echo "CI adimlarindan biri basarisiz oldu veya hatali sekilde atlandi!"
            exit 1
          fi
          echo "Tüm kritik adimlar basariyla gecildi veya güvenle atlandi."
