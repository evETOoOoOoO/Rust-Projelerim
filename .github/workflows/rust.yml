name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Rust
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    # Cache
    - name: Cargo Cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true

    # 🧠 Detect workspace root automatically
    - name: Find workspace root
      id: ws
      run: |
        ROOT=$(cargo metadata --no-deps --format-version 1 | jq -r '.workspace_root')
        echo "workspace=$ROOT" >> $GITHUB_OUTPUT
        echo "Workspace root: $ROOT"

    # 🧠 Detect changed files
    - name: Detect changes
      id: diff
      run: |
        git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD > changes.txt || true
        cat changes.txt

    # 🧠 Map changes → crates (smart step)
    - name: Map changes to crates
      id: crates
      run: |
        echo "Changed Rust files:"
        grep '\.rs$' changes.txt || true

        echo "Affected crates:"
        cargo metadata --format-version 1 > meta.json

        # naive but effective mapping
        CRATES=$(cat meta.json | jq -r '.packages[].name')

        echo "crates=$CRATES" >> $GITHUB_OUTPUT

    # 👀 Inspect ONLY new files but in context
    - name: Inspect changed files
      run: |
        if [ -s changes.txt ]; then
          while read file; do
            echo "→ $file"
            test -f "$file" && sed -n '1,120p' "$file"
          done < changes.txt
        fi

    # 🚀 Build only workspace (Cargo decides what changes)
    - name: Build workspace
      run: cargo build --workspace --locked --all-features

    # 🚀 Install nextest
    - name: Install nextest
      run: cargo install cargo-nextest --locked

    # 🚀 Test workspace
    - name: Test workspace
      run: cargo nextest run --workspace --locked --all-features

    # 🔥 Clippy workspace-wide
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    # 🎯 Format check
    - name: Format
      run: cargo fmt -- --check
