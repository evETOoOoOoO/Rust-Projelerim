name: Rust CI (Smart Crate Aware)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_TARGET_DIR: target-ci

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Fetch base
        run: git fetch origin --prune

      # =========================
      # Detect changes
      # =========================
      - name: Detect changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          BASE="origin/${{ github.event.repository.default_branch }}"

          MERGE_BASE=$(git merge-base HEAD "$BASE" || echo "HEAD~1")

          git diff --name-status "$MERGE_BASE" HEAD > diff.txt

          awk '
            $1 ~ /^(A|M)$/ && $2 ~ /\.rs$/ {print $2}
            $1 ~ /^R/ {print $3}
          ' diff.txt > changed_files.txt

          echo "run_all=false" >> $GITHUB_OUTPUT

          if grep -qE 'Cargo\.(toml|lock)' diff.txt; then
            echo "run_all=true" >> $GITHUB_OUTPUT
          fi

      # =========================
      # Workspace root (safe & deterministic)
      # =========================
      - name: Get workspace root
        id: root
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST=$(cargo metadata --no-deps --format-version 1 | jq -r '.workspace_root + "/Cargo.toml"')

          echo "manifest=$MANIFEST" >> $GITHUB_OUTPUT

      # =========================
      # Map files → crates
      # =========================
      - name: Map crates
        id: crates
        shell: bash
        run: |
          set -euo pipefail

          RUN_ALL="${{ steps.detect.outputs.run_all }}"

          if [ "$RUN_ALL" = "true" ] || [ ! -s changed_files.txt ]; then
            echo "crates=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cargo metadata --format-version 1 > meta.json

          CRATES=""

          while IFS= read -r file; do
            FULL="$GITHUB_WORKSPACE/$file"

            crate=$(jq -r --arg f "$FULL" '
              .packages[]
              | select(any(.targets[]; (.src_path | tostring) == $f))
              | .name
            ' meta.json | head -n 1)

            if [ -n "$crate" ] && [ "$crate" != "null" ]; then
              CRATES="$CRATES $crate"
            fi
          done < changed_files.txt

          CRATES=$(echo "$CRATES" | tr ' ' '\n' | awk 'NF' | sort -u | tr '\n' ' ')

          echo "crates=$CRATES" >> $GITHUB_OUTPUT

      # =========================
      # Build args
      # =========================
      - name: Build crate args
        id: args
        shell: bash
        run: |
          set -euo pipefail

          CRATES="${{ steps.crates.outputs.crates }}"

          if [ -z "$CRATES" ]; then
            echo "args=" >> $GITHUB_OUTPUT
            exit 0
          fi

          ARGS=""
          for c in $CRATES; do
            ARGS="$ARGS -p $c"
          done

          echo "args=$ARGS" >> $GITHUB_OUTPUT

      # =========================
      # Test
      # =========================
      - name: Test
        shell: bash
        run: |
          set -euo pipefail

          RUN_ALL="${{ steps.detect.outputs.run_all }}"
          MANIFEST="${{ steps.root.outputs.manifest }}"
          ARGS="${{ steps.args.outputs.args }}"

          if [ "$RUN_ALL" = "true" ]; then
            cargo test --workspace --locked
            exit 0
          fi

          if [ -z "$ARGS" ]; then
            echo "::notice::No affected crates"
            exit 0
          fi

          cargo test --manifest-path "$MANIFEST" $ARGS --locked

      # =========================
      # Clippy
      # =========================
      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail

          RUN_ALL="${{ steps.detect.outputs.run_all }}"
          MANIFEST="${{ steps.root.outputs.manifest }}"
          ARGS="${{ steps.args.outputs.args }}"

          if [ "$RUN_ALL" = "true" ]; then
            cargo clippy --workspace --all-targets -- -D warnings
            exit 0
          fi

          if [ -z "$ARGS" ]; then
            echo "::notice::No affected crates"
            exit 0
          fi

          cargo clippy --manifest-path "$MANIFEST" $ARGS --all-targets -- -D warnings

      # =========================
      # Format
      # =========================
      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
