name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings" 
  # OPTİMİZASYON: Derleme sırasında devasa hata ayıklama sembollerinin üretilmesini engeller.
  # Bu ayar derleme hızını artırır ve cache (önbellek) boyutunu küçültür.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      rust_changed: ${{ steps.filter.outputs.rust }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Check for Rust Changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          rust:
            - '**/*.rs'
            - '**/Cargo.toml'
            - '**/Cargo.lock'

  build-and-test:
    needs: check-changes
    if: needs.check-changes.outputs.rust_changed == 'true' || github.event_name == 'push'
    
    strategy:
      fail-fast: false 
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }} 

    steps:
    - uses: actions/checkout@v4
      with:
        convert-eol: false

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
        # OPTİMİZASYON: Standart cargo test yerine testleri paralel koşan ultra hızlı nextest'i kuruyoruz
        tools: cargo-nextest

    - name: Rust Cache
      uses: swatinem/rust-cache@v2
      with:
        # OPTİMİZASYON: Cache anahtarını daha benzersiz yaparak gereksiz önbellek geçersiz kılmalarını önleriz
        key: ${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Check Formatting
      run: cargo fmt -- --check

    - name: Lint with Clippy
      # OPTİMİZASYON: --no-deps ekleyerek Clippy'nin dış kütüphaneleri (bağımlılıkları) 
      # tekrar tekrar taramasını engelleriz, sadece bizim yazdığımız kodu tarar.
      run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings

    - name: Build
      # OPTİMİZASYON: cargo test zaten test kodlarını derlerken normal kodu da derler.
      # Ancak büyük projelerde karmaşayı önlemek için sadece test altyapısını önden derliyoruz.
      run: cargo test --workspace --no-run --verbose

    - name: Run Tests (Fast)
      # OPTİMİZASYON: Standart "cargo test" yerine "cargo nextest" kullanarak testleri 
      # çoklu çekirdek avantajıyla paralel ve kat kat hızlı koşturuyoruz.
      run: cargo nextest run --workspace --all-features --verbose

  ci-success:
    needs: [check-changes, build-and-test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI Status
        run: |
          CHECK_CHANGES_STATUS="${{ needs.check-changes.result }}"
          BUILD_TEST_STATUS="${{ needs.build-and-test.result }}"
          
          echo "Check Changes Durumu: $CHECK_CHANGES_STATUS"
          echo "Build and Test Durumu: $BUILD_TEST_STATUS"
          
          if [ "$CHECK_CHANGES_STATUS" = "failure" ] || \
             [ "$BUILD_TEST_STATUS" = "failure" ] || \
             [ "$BUILD_TEST_STATUS" = "cancelled" ] || \
             { [ "$BUILD_TEST_STATUS" = "skipped" ] && [ "${{ needs.check-changes.outputs.rust_changed }}" = "true" ]; }; then
            echo "CI adimlarindan biri basarisiz oldu, iptal edildi veya hatali sekilde atlandi!"
            exit 1
          fi
          echo "Tüm kritik adimlar basariyla gecildi veya güvenle atlandi."
