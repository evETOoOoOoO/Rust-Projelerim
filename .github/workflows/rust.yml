name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings -C opt-level=0"
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 1

jobs:
  # ==========================================
  # 1. JOB: DEĞİŞEN VE YENİ EKLENEN CRATE'LERİ TESPİT ETME
  # ==========================================
  detect-crates:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.detect.outputs.crates }}
      all_crates: ${{ steps.detect.outputs.all_crates }}
      changed_crates: ${{ steps.detect.outputs.changed_crates }}
      has_crates: ${{ steps.detect.outputs.has_crates }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Tüm Git geçmişini çekiyoruz ki değişiklik takibi doğru yapılabilsin

    # Gelişmiş değişiklik takip aracı: Yeni eklenen, değişen veya ismi değişen tüm dosyaları yakalar
    - name: Get Changed Files
      id: changed-files
      uses: tj-actions/changed-files@v44
      with:
        json: true
        escape_json: false

    - name: Detect All Crates and Changes
      id: detect
      run: |
        #!/bin/bash
        set -e
        
        echo "🔍 Workspace yapısı taranıyor..."
        
        # Projedeki tüm Cargo.toml dosyalarını buluyoruz (hedef dışı klasörleri hariç tutarak)
        CARGO_FILES=$(find . -name "Cargo.toml" -type f ! -path "*/target/*" ! -path "*/.git/*" | sort)
        
        if [ -z "$CARGO_FILES" ]; then
          echo "❌ Hata: Cargo.toml bulunamadı!"
          echo "has_crates=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi
        
        # ------------------------------------------
        # TÜM CRATE'LERİ LİSTELEME MANTIĞI
        # ------------------------------------------
        CRATES_JSON="["
        ALL_CRATES="["
        FIRST=true
        
        while IFS= read -r manifest; do
          CRATE_DIR=$(dirname "$manifest" | sed 's|^\./||') # Klasör yolunun başındaki ./ işaretini temizler
          CRATE_NAME=$(grep -m1 'name = "' "$manifest" | sed 's/name = "\(.*\)"/\1/' | sed 's/["-]/_/g')
          
          if [ -z "$CRATE_NAME" ]; then
            CRATE_NAME=$(basename "$CRATE_DIR")
          fi
          
          if [ "$FIRST" = true ]; then
            FIRST=false
          fi
          
          # JSON formatına uygun virgül ekleme yönetimi
          if [ "$CRATES_JSON" != "[" ]; then CRATES_JSON="${CRATES_JSON},"; fi
          if [ "$ALL_CRATES" != "[" ]; then ALL_CRATES="${ALL_CRATES},"; fi
          
          CRATES_JSON="${CRATES_JSON}\"${CRATE_DIR}\""
          ALL_CRATES="${ALL_CRATES}{\"path\":\"${CRATE_DIR}\",\"name\":\"${CRATE_NAME}\"}"
          
          echo "✅ Bulundu: $CRATE_NAME ($CRATE_DIR)"
        done <<< "$CARGO_FILES"
        
        CRATES_JSON="${CRATES_JSON}]"
        ALL_CRATES="${ALL_CRATES}]"
        
        echo "crates=${CRATES_JSON}" >> "$GITHUB_OUTPUT"
        echo "all_crates=${ALL_CRATES}" >> "$GITHUB_OUTPUT"
        echo "has_crates=true" >> "$GITHUB_OUTPUT"
        
        # ------------------------------------------
        # SADECE DEĞİŞEN/YENİ CRATE'LERİ FİLTRELEME MANTIĞI
        # ------------------------------------------
        echo ""
        echo "📝 Değişen ve yeni eklenen dosyalar analiz ediliyor..."
        
        # tj-actions adımından gelen ham değişen dosyalar listesi
        CHANGED_FILES_JSON='${{ steps.changed-files.outputs.all_changed_files }}'
        CRATES_ARRAY=()
        
        # Değişen her dosya yolu inceleniyor
        for file in $(echo "$CHANGED_FILES_JSON" | jq -r '.[]'); do
          # Dosyanın ait olduğu ana crate klasörünü buluyoruz
          for manifest in $CARGO_FILES; do
            CRATE_DIR=$(dirname "$manifest" | sed 's|^\./||')
            
            # Eğer değişen dosya bu crate klasörünün altındaysa listeye ekle
            if [[ "$file" == "$CRATE_DIR"* || "$CRATE_DIR" == "." ]]; then
              if [[ ! " ${CRATES_ARRAY[@]} " =~ " ${CRATE_DIR} " ]]; then
                CRATES_ARRAY+=("$CRATE_DIR")
                echo "🔄 Değişiklik/Yeni Ekleme Tespit Edildi: $CRATE_DIR (Dosya: $file)"
              fi
            fi
          done
        done
        
        # Array'i GitHub Actions'ın matris yapısına uygun JSON listesine dönüştürüyoruz
        if [ ${#CRATES_ARRAY[@]} -eq 0 ]; then
          CHANGED_CRATES="[]"
        else
          CHANGED_CRATES=$(printf '%s\n' "${CRATES_ARRAY[@]}" | jq -R . | jq -s -c .)
        fi
        
        # Eğer push olayı ise tümünü test etme kuralını koruyoruz (İsteğe bağlı değiştirilebilir)
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "changed_crates=${CRATES_JSON}" >> "$GITHUB_OUTPUT"
          echo "📦 Push tespit edildi: TÜM crate'ler test matrisine alınıyor."
        else
          echo "changed_crates=${CHANGED_CRATES}" >> "$GITHUB_OUTPUT"
          echo "🔍 PR/Değişiklik tespit edildi: Sadece değişen crate'ler test edilecek."
        fi

  # ==========================================
  # 2. JOB: DERLEME VE TEST (DİNAMİK MATRİS)
  # ==========================================
  build-and-test:
    needs: detect-crates
    # Eğer değişen hiçbir crate yoksa bu adımı atla (boş matris hatasını önler)
    if: needs.detect-crates.outputs.has_crates == 'true' && needs.detect-crates.outputs.changed_crates != '[]'
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        crate: ${{ fromJson(needs.detect-crates.outputs.changed_crates) }}

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Detect Crate Info
      id: crate_info
      run: |
        MANIFEST="${{ matrix.crate }}/Cargo.toml"
        CRATE_NAME=$(grep -m1 'name = "' "$MANIFEST" | sed 's/name = "\(.*\)"/\1/')
        
        echo "name=${CRATE_NAME}" >> "$GITHUB_OUTPUT"
        echo "path=${{ matrix.crate }}" >> "$GITHUB_OUTPUT"
        echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"
        
        echo "📦 Crate: $CRATE_NAME"
        echo "📁 Path: ${{ matrix.crate }}"

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2.9.1
      with:
        workspaces: ${{ matrix.crate }}
        key: ${{ matrix.os }}-${{ steps.crate_info.outputs.name }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.crate)) }}
        cache-on-failure: true

    - name: Run Code Formatting Check
      working-directory: ${{ matrix.crate }}
      run: cargo fmt --all -- --check
      continue-on-error: true

    - name: Run Clippy Static Analysis
      working-directory: ${{ matrix.crate }}
      run: cargo clippy --all-targets --all-features --no-deps -- -D warnings
      continue-on-error: true

    - name: Build Crate
      working-directory: ${{ matrix.crate }}
      run: cargo build --all-features --release

    - name: Run Tests
      working-directory: ${{ matrix.crate }}
      run: cargo test --all-features -- --test-threads=4

    - name: Check Documentation
      working-directory: ${{ matrix.crate }}
      run: cargo doc --all-features --no-deps
      continue-on-error: true

  # ==========================================
  # 3. JOB: LINT KONTROLLERİ (TÜM WORKSPACE)
  # ==========================================
  lint-check:
    needs: detect-crates
    if: needs.detect-crates.outputs.has_crates == 'true'
    
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.detect-crates.outputs.all_crates) }}

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2.9.1
      with:
        workspaces: ${{ matrix.crate.path }}
        key: ubuntu-latest-lint-${{ matrix.crate.name }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.crate.path)) }}

    - name: Check deny.toml exists
      id: check_deny
      run: |
        if [ -f "${{ matrix.crate.path }}/deny.toml" ]; then
          echo "has_deny=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_deny=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Cargo Deny Check
      if: steps.check_deny.outputs.has_deny == 'true'
      working-directory: ${{ matrix.crate.path }}
      run: cargo deny check
      continue-on-error: true

  # ==========================================
  # 4. JOB: GÜVENLİK TARAMASI
  # ==========================================
  security-audit:
    needs: detect-crates
    if: needs.detect-crates.outputs.has_crates == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2.9.1
      with:
        key: ubuntu-latest-audit

    - name: Install cargo-audit
      run: |
        if ! command -v cargo-audit &> /dev/null; then
          cargo install cargo-audit
        fi

    - name: Run Security Audit for all crates
      run: |
        echo "🔒 Güvenlik taraması yapılıyor..."
        CARGO_FILES=$(find . -name "Cargo.toml" -type f ! -path "*/target/*" ! -path "*/.git/*")
        
        while IFS= read -r manifest; do
          CRATE_DIR=$(dirname "$manifest")
          CRATE_NAME=$(grep -m1 'name = "' "$manifest" | sed 's/name = "\(.*\)"/\1/')
          
          echo ""
          echo "📦 Scanning: $CRATE_NAME ($CRATE_DIR)"
          cd "$CRATE_DIR"
          cargo audit || true
          cd - > /dev/null
        done <<< "$CARGO_FILES"

  # ==========================================
  # 5. JOB: CI SONUÇ DEĞERLENDİRME
  # ==========================================
  ci-success:
    needs: [detect-crates, build-and-test, lint-check, security-audit]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Evaluate CI Status
        run: |
          DETECT_RESULT="${{ needs.detect-crates.result }}"
          BUILD_RESULT="${{ needs.build-and-test.result }}"
          LINT_RESULT="${{ needs.lint-check.result }}"
          SECURITY_RESULT="${{ needs.security-audit.result }}"
          
          HAS_CRATES="${{ needs.detect-crates.outputs.has_crates }}"
          CRATES_COUNT=$(echo '${{ needs.detect-crates.outputs.all_crates }}' | grep -o '"path"' | wc -l)
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 CI Sonuçları:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Crates Tespit: $DETECT_RESULT (Toplam: $CRATES_COUNT)"
          echo "Build & Test: $BUILD_RESULT"
          echo "Lint Check: $LINT_RESULT"
          echo "Security Audit: $SECURITY_RESULT"
          echo ""
          
          if [[ "$DETECT_RESULT" == "failure" ]]; then
            echo "❌ HATA: Cargo.toml bulunamadı! Workspace yapısını kontrol edin."
            exit 1
          fi
          
          # Eğer değişen dosya olmadığı için build skip edildiyse hata verme, success say
          if [[ "$BUILD_RESULT" == "failure" ]]; then
            echo "❌ HATA: Build veya test başarısız oldu!"
            exit 1
          fi
          
          if [[ "$BUILD_RESULT" == "cancelled" ]]; then
            echo "⚠️  UYARI: Build adımı iptal edildi!"
            exit 1
          fi
          
          echo "✅ CI Süreci başarıyla tamamlandı!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
