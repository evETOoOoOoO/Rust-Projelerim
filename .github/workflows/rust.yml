name: Rust CI (Smart Crate Aware)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_TARGET_DIR: target-ci

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-cache

      - name: Fetch base branch
        run: git fetch origin --prune

      # =========================
      # 1. Detect changes
      # =========================
      - name: Detect changed files
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="origin/${{ github.event.repository.default_branch }}"
            if [ "origin/${{ github.ref_name }}" = "$BASE" ]; then
              BASE="${{ github.event.before }}"
            fi
          fi

          # İlk commit / geçersiz before durumunda boş tree kullan
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          # Tek diff çağrısı
          git diff --name-status "$BASE...HEAD" > diff.txt

          # A/M için ikinci kolon, rename için son kolon yeni dosya yoludur
          awk '
            $1 ~ /^(A|M)$/ && $2 ~ /\.rs$/ {print $2}
            $1 ~ /^R/ {print $NF}
          ' diff.txt > changed_files.txt

          echo "Changed Rust files:"
          if [ -s changed_files.txt ]; then
            cat changed_files.txt
          else
            echo "No Rust changes"
          fi

          # Cargo.toml veya Cargo.lock değişirse full workspace çalıştır
          if awk '$0 ~ /(^|[[:space:]])Cargo\.(toml|lock)$/ {found=1} END {exit !found}' diff.txt; then
            echo "Cargo configuration or dependencies changed. Forcing full workspace run."
            echo "run_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_all=false" >> "$GITHUB_OUTPUT"
          fi

      # =========================
      # 2. Map files → crates
      # =========================
      - name: Map files to crates
        id: crates
        shell: bash
        run: |
          set -euo pipefail

          RUN_ALL="${{ steps.detect.outputs.run_all }}"

          if [ "$RUN_ALL" = "true" ] || [ ! -s changed_files.txt ]; then
            echo "crates=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cargo metadata --format-version 1 > meta.json

          CRATES=""

          while IFS= read -r file; do
            FULL="$GITHUB_WORKSPACE/$file"

            crate=$(jq -r --arg f "$FULL" '
              .packages[]
              | select($f | startswith((.manifest_path | dirname) + "/"))
              | .name
            ' meta.json | head -n 1)

            if [ -n "$crate" ]; then
              CRATES="$CRATES $crate"
            fi
          done < changed_files.txt

          CRATES=$(echo "$CRATES" | tr ' ' '\n' | awk 'NF' | sort -u | tr '\n' ' ' | sed 's/ $//')

          echo "crates=$CRATES" >> "$GITHUB_OUTPUT"
          echo "Detected crates: $CRATES"

      # =========================
      # 3. Safety check
      # =========================
      - name: Validate detection
        shell: bash
        run: |
          set -euo pipefail

          if [ -s changed_files.txt ] && \
             [ -z "${{ steps.crates.outputs.crates }}" ] && \
             [ "${{ steps.detect.outputs.run_all }}" = "false" ]; then
            echo "ERROR: Rust files changed but no crates detected. Check your workspace paths."
            cat changed_files.txt
            exit 1
          fi

      # =========================
      # 4. Tests
      # =========================
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          RUN_ALL="${{ steps.detect.outputs.run_all }}"
          CRATES="${{ steps.crates.outputs.crates }}"

          if [ "$RUN_ALL" = "true" ]; then
            echo "Running full workspace tests"
            cargo test --workspace --locked --all-features
            exit 0
          fi

          if [ -z "$CRATES" ]; then
            echo "No affected crates"
            exit 0
          fi

          ARGS=""
          for c in $CRATES; do
            ARGS="$ARGS -p $c"
          done

          echo "Testing crates: $ARGS"
          cargo test $ARGS --locked --all-features

      # =========================
      # 5. Clippy
      # =========================
      - name: Run clippy
        shell: bash
        run: |
          set -euo pipefail

          RUN_ALL="${{ steps.detect.outputs.run_all }}"
          CRATES="${{ steps.crates.outputs.crates }}"

          if [ "$RUN_ALL" = "true" ]; then
            echo "Running full workspace clippy"
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            exit 0
          fi

          if [ -z "$CRATES" ]; then
            echo "No affected crates"
            exit 0
          fi

          ARGS=""
          for c in $CRATES; do
            ARGS="$ARGS -p $c"
          done

          echo "Clippy crates: $ARGS"
          cargo clippy $ARGS --all-targets --all-features -- -D warnings

      # =========================
      # 6. Format check
      # =========================
      - name: Format check
        run: cargo fmt --all -- --check
