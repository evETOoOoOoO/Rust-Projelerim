name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings -C opt-level=0"
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 1

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      rust_changed: ${{ steps.filter.outputs.rust }}
      cargo_lock_changed: ${{ steps.filter.outputs.cargo_lock }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for Rust Changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          rust:
            - '**/*.rs'
            - '**/Cargo.toml'
          cargo_lock:
            - '**/Cargo.lock'

  build-and-test:
    needs: check-changes
    if: needs.check-changes.outputs.rust_changed == 'true' || github.event_name == 'push'
    
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.4

    - name: Rust Cache
      uses: swatinem/rust-cache@v2
      with:
        key: ${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
        cache-on-failure: true

    - name: Run Code Formatting Check
      run: cargo fmt --all -- --check

    - name: Run Clippy Static Analysis
      run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings

    - name: Build Workspace
      run: cargo build --workspace --all-features --release

    - name: Run Tests
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "🔍 PR tespit edildi. Değişen paketler test ediliyor..."
          cargo test --workspace --all-features --lib --bins -- --test-threads=4
        else
          echo "📦 Push tespit edildi. Tüm workspace test ediliyor..."
          cargo test --workspace --all-features -- --test-threads=4
        fi

    - name: Check Documentation
      run: cargo doc --workspace --all-features --no-deps

  lint-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cargo Deny Check
      uses: EmbarkStudios/cargo-deny-action@v1
      with:
        log-level: warn

  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4

    - name: Security Audit
      uses: rustsec/audit-check-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  ci-success:
    needs: [check-changes, build-and-test, lint-check, security-audit]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Evaluate CI Status
        run: |
          CHECK_RESULT="${{ needs.check-changes.result }}"
          BUILD_RESULT="${{ needs.build-and-test.result }}"
          LINT_RESULT="${{ needs.lint-check.result }}"
          SECURITY_RESULT="${{ needs.security-audit.result }}"
          
          RUST_CHANGED="${{ needs.check-changes.outputs.rust_changed }}"
          
          # Hata durumlarını kontrol et
          if [[ "$CHECK_RESULT" == "failure" ]] || [[ "$BUILD_RESULT" == "failure" ]]; then
            echo "❌ Kritik CI adımı başarısız oldu!"
            exit 1
          fi
          
          # İptal edilmiş durumları kontrol et
          if [[ "$BUILD_RESULT" == "cancelled" ]]; then
            echo "⚠️  Build adımı iptal edildi!"
            exit 1
          fi
          
          # Lint kontrolleri başarısız olsa da devam et (uyarı)
          if [[ "$LINT_RESULT" == "failure" ]]; then
            echo "⚠️  Lint kontrolleri başarısız oldu. Detayları kontrol edin."
          fi
          
          # Güvenlik denetimi başarısız olsa da devam et (uyarı)
          if [[ "$SECURITY_RESULT" == "failure" ]]; then
            echo "⚠️  Güvenlik denetimi başarısız oldu. Detayları kontrol edin."
          fi
          
          echo "✅ Tüm kritik adımlar başarıyla tamamlandı!"
